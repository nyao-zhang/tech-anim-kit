[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "tech-anim-kit"
version = "0.1.0"
description = "Cross-DCC technical animation toolkit: pluggable rig rules, safe DSL executor, unified Qt/Web design system"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "nyao-zhang" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff>=0.4"]

[tool.setuptools.packages.find]
include = ["tak*", "tools*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]
