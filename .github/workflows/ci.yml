name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  core-tests:
    name: core (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest
      - name: Run test suite
        run: python -m pytest -q
      - name: Module docs match code
        # 单独命名这一步：文档与代码漂移时，失败信息直接指向 docs/modules/
        run: python -m pytest tests/test_docs_modules.py -q
      - name: Golden fixtures are reproducible
        run: python fixtures/generate_fixtures.py --check
      - name: Design tokens are in sync
        run: python tak/ui/generate_theme.py --check
      - name: Core layer smoke check (no pytest / no DCC)
        run: python validation/py_compat_smoke.py
      - name: Tool plugins are discoverable
        run: python tools/new_tool.py --list
      - name: Four-DCC conformance regression (40 golden fixtures)
        run: python validation/four_dcc_regression.py --out validation/four_dcc_ci.json
      - name: Installer is discoverable and dry-run only
        run: |
          python -m tak.install --list --json > /dev/null
          # --plan 是默认行为（dry_run=True）：这一步必须保证磁盘零改动，
          # 否则 CI 会在 runner 的用户目录里写启动脚本。
          python -m tak.install --plan --json > /dev/null
      - name: Motion library and dataset factory are DCC-free
        run: |
          python - <<'PY'
          import json, glob
          from tak.core.motion import MotionLibrary
          from tak.core.mldeformer import build_plan, build_manifest

          lib = MotionLibrary()
          assert lib.search("走路 循环", top_k=3), "动作检索无结果"
          assert lib.search("") , "空查询未列出全部"

          snap = json.load(open(sorted(glob.glob("fixtures/good/*.json"))[0],
                                encoding="utf-8"))["snapshot"]
          a = build_manifest(build_plan(snap))
          b = build_manifest(build_plan(snap))
          assert a["version"] == b["version"], "数据集清单不可复现"
          print("OK: motion %d clips / mld %d poses %s"
                % (lib.describe()["clip_count"], a["pose_count"], a["version"]))
          PY
      - name: Python 3.9 syntax scan (all shipped code)
        run: |
          python - <<'PY'
          import ast, os, sys
          skip = ('.git', '.pytest_cache', '__pycache__', '.workbuddy',
                  'legacy', 'Intermediate', 'Saved', 'DerivedDataCache',
                  'TakProbe', '.venv', 'venv', 'build', 'dist')
          bad = []
          for root, dirs, files in os.walk('.'):
              dirs[:] = [d for d in dirs if d not in skip]
              for name in files:
                  if not name.endswith('.py'):
                      continue
                  path = os.path.join(root, name)
                  try:
                      with open(path, encoding='utf-8') as fh:
                          ast.parse(fh.read(), feature_version=(3, 9))
                  except (SyntaxError, UnicodeError) as exc:
                      bad.append((path, str(exc)))
          if bad:
              print('Python 3.9 incompatible:', bad)
              sys.exit(1)
          print('OK: all shipped Python parses as 3.9')
          PY
      - name: Core layer has no DCC imports
        run: |
          python - <<'PY'
          import os, re, sys
          bad = []
          pattern = re.compile(r"^\s*(from|import)\s+(maya|pymxs|pyfbsdk|unreal)\b", re.M)
          for root in ("tak/core", "tak/adapters/base.py"):
              for base, _, files in os.walk(root) if os.path.isdir(root) else [("", "", [root])]:
                  for name in files:
                      if not name.endswith(".py"):
                          continue
                      path = os.path.join(base, name)
                      with open(path, encoding="utf-8") as fh:
                          if pattern.search(fh.read()):
                              bad.append(path)
          if bad:
              print("DCC imports found in core:", bad)
              sys.exit(1)
          print("OK: core layer is DCC-free")
          PY

  coverage-gate:
    name: coverage gate (DCC-free core >=80%)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest pytest-cov
      # 硬门槛只作用于零 DCC 依赖的 tak.core：这是 CI 能真实覆盖的层。
      # tak.adapters / tak.ui 依赖宿主运行时（Maya GUI、UE Editor、Qt），
      # 无头 Linux 上无法真实覆盖，因此整体覆盖率只做观测、不设门槛。
      - name: Enforce core coverage
        run: python -m pytest --cov=tak.core --cov-report=term-missing --cov-fail-under=80 -q
      - name: Report overall coverage (informational)
        run: python -m pytest --cov=tak --cov-report=term -q
